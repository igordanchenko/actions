name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install semantic-release toolchain
        run: npm ci --no-audit --no-fund --strict-allow-scripts
        working-directory: semantic-release

      - name: Test
        run: node --test
