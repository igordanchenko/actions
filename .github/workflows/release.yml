name: Release

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install semantic-release toolchain
        run: npm ci --no-audit --no-fund --strict-allow-scripts
        working-directory: semantic-release

      - name: Audit signatures
        run: npm audit signatures
        working-directory: semantic-release

      - name: Test
        run: node --test

      - name: Release
        uses: ./semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
