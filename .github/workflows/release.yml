name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install semantic-release toolchain
        run: npm ci --no-audit --no-fund --strict-allow-scripts
        working-directory: semantic-release

      - name: Verify toolchain signatures
        run: npm audit signatures
        working-directory: semantic-release

      - name: Test
        run: node --test

      - name: Release
        uses: ./semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
