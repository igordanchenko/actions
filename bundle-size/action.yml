name: Bundle Size
description: Record a size-limit measurement in package.json for a shields.io badge

inputs:
  entry:
    description: The size-limit entry to record, matched by its `path` (or by `name`, if you set one in the config)
    required: false
    default: dist/index.js
  field:
    description: package.json field to write the formatted size to
    required: false
    default: bundleSize
  working-directory:
    description: Directory containing the package to measure
    required: false
    default: .

outputs:
  bytes:
    description: Measured size in bytes
    value: ${{ steps.measure.outputs.bytes }}
  size:
    description: Formatted size written to package.json
    value: ${{ steps.measure.outputs.size }}

runs:
  using: composite
  steps:
    - id: measure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENTRY: ${{ inputs.entry }}
        FIELD: ${{ inputs.field }}
      run: |
        set -euo pipefail

        # `--` keeps npm from consuming `--json` itself (it's a valid npm config flag);
        # without it size-limit receives no args and prints a human-readable table.
        json=$(npx --no -- size-limit --json)

        bytes=$(printf '%s' "$json" | node -e '
          const data = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
          // size-limit reports each entry under its `name`, which defaults to `path` when unset,
          // so matching on `name` covers both the `path` default and an explicit `name`.
          const entry = data.find((e) => e.name === process.env.ENTRY);
          if (!entry || typeof entry.size !== "number") {
            const names = data.map((e) => `"${e.name}"`).join(", ") || "none";
            console.error(`::error::bundle-size: no size-limit entry matching "${process.env.ENTRY}" (available: ${names})`);
            process.exit(1);
          }
          process.stdout.write(String(entry.size));
        ')

        size=$(node -e '
          // Adaptive unit, 3 significant digits: "747 B", "1.07 kB", "10.7 kB", "748 kB", "1.24 MB".
          // The kB value is rounded before the unit check so 999.7 kB rolls over to "1 MB", not "1000 kB".
          const bytes = Number(process.argv[1]);
          const fmt = (n) => Number(n.toPrecision(3));
          const kb = fmt(bytes / 1e3);
          process.stdout.write(bytes < 1000 ? `${bytes} B` : kb < 1000 ? `${kb} kB` : `${fmt(bytes / 1e6)} MB`);
        ' "$bytes")

        npm pkg set "$FIELD=$size"

        echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
        echo "size=$size" >> "$GITHUB_OUTPUT"
        echo "::notice::$FIELD=$size ($bytes bytes, entry \"$ENTRY\")"
